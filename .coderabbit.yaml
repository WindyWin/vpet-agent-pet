# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Release PRs only bump the version in starter/CMakeLists.txt (see
# .claude/skills/gh-publish-release); a review there just stalls the release.
reviews:
  auto_review:
    ignore_title_keywords:
      - "Bump version to"
  # Docs, ADRs and README media are not reviewed.
  path_filters:
    - "!**/*.md"
    - "!docs/**"
    - "!starter/docs/**"

name: Build and package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    # Docs-only PRs need no build; docs-prefixed main pushes skip jobs below.
    # Later patterns win: the notices and licenses compiled into the app still build.
    paths: ["**", "!**.md", "!docs/**", "!starter/docs/**", "!.claude/**",
            "starter/THIRD_PARTY_NOTICES.md", "starter/licenses/**"]
  workflow_dispatch:

permissions:
  contents: read

# One version for SDK installation and the corresponding source archives.
env:
  QT_VERSION: "6.5.3"

# Superseded branch/PR runs are cancelled; tag runs always finish.
# A skipped docs push must not cancel the preceding main build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'docs') && '-docs' || '' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux:
    # Skip PRs from release/* branches (version bumps already built on the feature branches), and their
    # merge into main: the release tag on that same commit builds it. head_ref is empty for push/tag/dispatch
    # runs, and only the main branch push checks the merge message.
    # Docs-prefixed main pushes skip all platforms; tags and manual builds still run.
    if: >-
      ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main'
      && startsWith(github.event.head_commit.message, 'docs'))
      && !startsWith(github.head_ref, 'release/') && !(github.ref == 'refs/heads/main'
      && startsWith(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, format('from {0}/release/', github.repository_owner))) }}
    # Ubuntu 22.04 sets the glibc 2.35 baseline for the released binary.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: starter
    steps:
      - uses: actions/checkout@v4

      - name: Verify assets
        run: |
          python3 scripts/verify_assets.py
          python3 ../scripts/assets.py verify

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build patchelf bubblewrap \
            desktop-file-utils zlib1g-dev libarchive-dev libssl-dev libgl-dev libegl-dev libx11-dev libxtst-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Cache compiler output
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-qt6.5.3
          max-size: 500M

      - name: Build and test portable core
        run: |
          cmake -S . -B build-core -G Ninja -DAGENT_PET_PORTABLE_CORE=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_DISABLE_FIND_PACKAGE_X11=TRUE -DCMAKE_DISABLE_FIND_PACKAGE_LibArchive=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6Widgets=TRUE -DCMAKE_DISABLE_FIND_PACKAGE_Qt6Network=TRUE
          cmake --build build-core
          ctest --test-dir build-core --output-on-failure

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DAGENT_PET_REVISION="${GITHUB_SHA::12}"
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"

      - name: Check translations are current
        run: |
          cmake --build build --target update_translations
          python3 scripts/check_translations.py

      - name: Package
        run: |
          QMAKE="$QT_ROOT_DIR/bin/qmake" python3 scripts/package.py
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test -d "dist/agent-pet-${GITHUB_REF_NAME#v}-linux-x86_64" || { echo "Tag does not match project() version"; exit 1; }
          fi
          ls -l dist

      - name: Check isolated package
        run: python3 scripts/check_isolated.py dist/agent-pet-*-linux-x86_64

      - name: Check install, upgrade and uninstall
        run: python3 scripts/check_install.py dist/agent-pet-*-linux-x86_64.tar.gz

      - name: Check upgrades from the previous two releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_previous_releases.py dist/agent-pet-*-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: agent-pet-linux-x86_64
          path: |
            starter/dist/*.tar.gz
            starter/dist/*-components.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: release-component-blobs
          path: starter/dist/blobs/
          if-no-files-found: error

  macos:
    if: >-
      ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main'
      && startsWith(github.event.head_commit.message, 'docs'))
      && !startsWith(github.head_ref, 'release/') && !(github.ref == 'refs/heads/main'
      && startsWith(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, format('from {0}/release/', github.repository_owner))) }}
    # One universal (arm64 + x86_64) bundle for macOS 11 and newer.
    runs-on: macos-14
    defaults:
      run:
        working-directory: starter
    steps:
      - uses: actions/checkout@v4

      - name: Verify assets
        run: python3 scripts/verify_assets.py

      - name: Install build tools
        run: brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Build and test portable core
        run: |
          cmake -S . -B build-core -G Ninja -DAGENT_PET_PORTABLE_CORE=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-core
          ctest --test-dir build-core --output-on-failure

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DAGENT_PET_REVISION="${GITHUB_SHA::12}"
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -j"$(sysctl -n hw.ncpu)"

      - name: Package
        run: |
          QMAKE="$QT_ROOT_DIR/bin/qmake" python3 scripts/package_macos.py --universal
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test -f "dist/agent-pet-${GITHUB_REF_NAME#v}-macos-universal.zip" || { echo "Tag does not match project() version"; exit 1; }
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: agent-pet-macos-universal
          path: |
            starter/dist/*.zip
          if-no-files-found: error

  windows:
    if: >-
      ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main'
      && startsWith(github.event.head_commit.message, 'docs'))
      && !startsWith(github.head_ref, 'release/') && !(github.ref == 'refs/heads/main'
      && startsWith(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, format('from {0}/release/', github.repository_owner))) }}
    # x64 with MSVC, for Windows 10 1809 and newer.
    runs-on: windows-2022
    defaults:
      run:
        working-directory: starter
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Verify assets
        run: python scripts/verify_assets.py

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build tools
        run: |
          python -m pip install --disable-pip-version-check ninja
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Install ZIP dependency
        run: |
          vcpkg install zlib:x64-windows-static-md
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64
          cache: true

      - name: Build and test portable core
        run: |
          cmake -S . -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -B build-core -G Ninja -DAGENT_PET_PORTABLE_CORE=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-core
          ctest --test-dir build-core --output-on-failure

      - name: Build
        run: |
          cmake -S . -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DAGENT_PET_REVISION=$($env:GITHUB_SHA.Substring(0, 12))"
          cmake --build build

      - name: Test
        # CTest starts tests without a console, where Qt Test otherwise logs to the debugger.
        env:
          QT_FORCE_STDERR_LOGGING: "1"
        run: ctest --test-dir build --output-on-failure -j $env:NUMBER_OF_PROCESSORS

      - name: Package
        run: |
          $env:QMAKE = "$env:QT_ROOT_DIR\bin\qmake.exe"
          python scripts/package_windows.py --smoke-test
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            if (-not (Test-Path "dist/agent-pet-$version-windows-x86_64-setup.exe")) { throw "Tag does not match project() version" }
          }
          Get-ChildItem dist

      - name: Build older setup fixture
        run: |
          $env:QMAKE = "$env:QT_ROOT_DIR\bin\qmake.exe"
          python scripts/build_windows_update_fixture.py --output dist-update-fixture --vcpkg-triplet x64-windows-static-md

      - name: Check install, upgrade and uninstall
        run: python scripts/check_install_windows.py (Get-Item dist/agent-pet-*-windows-x86_64-setup.exe).FullName --previous-setup (Get-Item dist-update-fixture/agent-pet-*-windows-x86_64-setup.exe).FullName

      - uses: actions/upload-artifact@v4
        with:
          name: agent-pet-windows-x86_64
          path: |
            starter/dist/*-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    concurrency:
      group: release-blob-store
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-pet-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-component-blobs
          path: blobs
      - name: Publish shared release components
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 starter/scripts/release_blobs.py publish .
      # Source for the Arch AUR package: only starter/, without the repository's 749 MB artwork bundle.
      - name: Source tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --prefix="agent-pet-$version/" -o "agent-pet-$version-source.tar.gz" "$GITHUB_SHA:starter"
      # Download failure or a checksum mismatch prevents publishing binaries without Qt source.
      - name: Collect corresponding Qt source
        run: python3 starter/scripts/qt_licenses.py --download-sources "$QT_VERSION" --output .
      - name: Generate download table
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="agent-pet-$version"
          download="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          docs="https://github.com/$GITHUB_REPOSITORY/blob/main"
          # Every download link must point to a nonempty asset in this release.
          for suffix in windows-x86_64-setup.exe macos-universal.zip linux-x86_64.tar.gz source.tar.gz; do
            test -s "$package-$suffix" || { echo "Missing download: $package-$suffix"; exit 1; }
          done
          cat > release-notes.md <<EOF
          ## Download / Tải xuống

          Choose your operating system below. Each package includes the app, runtime and pet artwork.
          Chọn hệ điều hành bên dưới. Mỗi gói đã bao gồm ứng dụng, thư viện và hình ảnh thú cưng.

          | Operating system / Hệ điều hành | Download / Tải xuống | Install / Cài đặt |
          | --- | --- | --- |
          | Windows 10 (1809+) / 11 · x64 | [**Download Windows**]($download/$package-windows-x86_64-setup.exe) | Run the installer / Chạy bộ cài |
          | macOS 11+ · Apple silicon & Intel | [**Download macOS**]($download/$package-macos-universal.zip) | Extract and move Agent Pet into Applications / Giải nén và chuyển Agent Pet vào Applications |
          | Linux · x86_64 | [**Download Linux**]($download/$package-linux-x86_64.tar.gz) | Extract and run ./install.sh / Giải nén và chạy ./install.sh |

          [Installation guide]($docs/starter/docs/install.md) · [Hướng dẫn tiếng Việt]($docs/README.vi.md#bắt-đầu)

          <details>
          <summary>Source / Mã nguồn</summary>

          - [Source archive (starter/)]($download/$package-source.tar.gz)
          - Qt $QT_VERSION source: [QtBase]($download/qtbase-everywhere-src-$QT_VERSION.tar.xz), [QtSvg]($download/qtsvg-everywhere-src-$QT_VERSION.tar.xz), [QtImageFormats]($download/qtimageformats-everywhere-src-$QT_VERSION.tar.xz) · [SHA-256 checksums]($download/qt-source-SHA256SUMS.txt)

          </details>

          The app uses \`components.json\` to download changed components automatically when updating. For installation, use the links above.
          Ứng dụng dùng \`components.json\` để tự tải các thành phần đã thay đổi khi cập nhật. Để cài đặt, dùng các liên kết phía trên.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            *.tar.gz
            *.tar.xz
            qt-source-SHA256SUMS.txt
            *-components.json
            *.zip
            *-setup.exe

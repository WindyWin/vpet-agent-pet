name: Build and package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    # Docs-only PRs need no build; main still builds every merge, and it gates releases.
    # Later patterns win: the notices and licenses compiled into the app still build.
    paths: ["**", "!**.md", "!docs/**", "!starter/docs/**", "!.claude/**",
            "starter/THIRD_PARTY_NOTICES.md", "starter/licenses/**"]
  workflow_dispatch:

permissions:
  contents: read

# Superseded branch/PR runs are cancelled; tag runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux:
    # Skip PRs from release/* branches (version bumps already built on the feature branches), and their
    # merge into main: the release tag on that same commit builds it. head_ref is empty for push/tag/dispatch
    # runs, and only the main branch push checks the merge message.
    if: >-
      ${{ !startsWith(github.head_ref, 'release/') && !(github.ref == 'refs/heads/main'
      && startsWith(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, format('from {0}/release/', github.repository_owner))) }}
    # Ubuntu 22.04 sets the glibc 2.35 baseline for the released binary.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: starter
    steps:
      - uses: actions/checkout@v4

      - name: Verify assets
        run: |
          python3 scripts/verify_assets.py
          python3 ../scripts/assets.py verify

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build patchelf bubblewrap \
            desktop-file-utils libarchive-dev libssl-dev libgl-dev libegl-dev libx11-dev libxtst-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.3"
          cache: true

      - name: Cache compiler output
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-qt6.5.3
          max-size: 500M

      - name: Build and test portable core
        run: |
          cmake -S . -B build-core -G Ninja -DAGENT_PET_PORTABLE_CORE=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_DISABLE_FIND_PACKAGE_X11=TRUE -DCMAKE_DISABLE_FIND_PACKAGE_LibArchive=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt6Widgets=TRUE -DCMAKE_DISABLE_FIND_PACKAGE_Qt6Network=TRUE
          cmake --build build-core
          ctest --test-dir build-core --output-on-failure

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DAGENT_PET_REVISION="${GITHUB_SHA::12}"
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"

      - name: Check translations are current
        run: |
          cmake --build build --target update_translations
          python3 scripts/check_translations.py

      - name: Package
        run: |
          QMAKE="$QT_ROOT_DIR/bin/qmake" python3 scripts/package.py
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test -d "dist/agent-pet-${GITHUB_REF_NAME#v}-linux-x86_64" || { echo "Tag does not match project() version"; exit 1; }
          fi
          ls -l dist

      - name: Check isolated package
        run: python3 scripts/check_isolated.py dist/agent-pet-*-linux-x86_64

      - name: Check install, upgrade and uninstall
        run: python3 scripts/check_install.py dist/agent-pet-*-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: agent-pet-linux-x86_64
          path: |
            starter/dist/*.tar.gz
            starter/dist/*-components.json
          if-no-files-found: error

  macos:
    if: >-
      ${{ !startsWith(github.head_ref, 'release/') && !(github.ref == 'refs/heads/main'
      && startsWith(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, format('from {0}/release/', github.repository_owner))) }}
    # One universal (arm64 + x86_64) bundle for macOS 11 and newer.
    runs-on: macos-14
    defaults:
      run:
        working-directory: starter
    steps:
      - uses: actions/checkout@v4

      - name: Verify assets
        run: python3 scripts/verify_assets.py

      - name: Install build tools
        run: brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.3"
          cache: true

      - name: Build and test portable core
        run: |
          cmake -S . -B build-core -G Ninja -DAGENT_PET_PORTABLE_CORE=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-core
          ctest --test-dir build-core --output-on-failure

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DAGENT_PET_REVISION="${GITHUB_SHA::12}"
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -j"$(sysctl -n hw.ncpu)"

      - name: Package
        run: |
          QMAKE="$QT_ROOT_DIR/bin/qmake" python3 scripts/package_macos.py --universal
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            for asset in zip dmg; do
              test -f "dist/agent-pet-${GITHUB_REF_NAME#v}-macos-universal.$asset" || { echo "Tag does not match project() version"; exit 1; }
            done
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: agent-pet-macos-universal
          path: |
            starter/dist/*.zip
            starter/dist/*.dmg
          if-no-files-found: error

  windows:
    if: >-
      ${{ !startsWith(github.head_ref, 'release/') && !(github.ref == 'refs/heads/main'
      && startsWith(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, format('from {0}/release/', github.repository_owner))) }}
    # x64 with MSVC, for Windows 10 1809 and newer.
    runs-on: windows-2022
    defaults:
      run:
        working-directory: starter
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Verify assets
        run: python scripts/verify_assets.py

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build tools
        run: |
          python -m pip install --disable-pip-version-check ninja
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.3"
          arch: win64_msvc2019_64
          cache: true

      - name: Build and test portable core
        run: |
          cmake -S . -B build-core -G Ninja -DAGENT_PET_PORTABLE_CORE=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-core
          ctest --test-dir build-core --output-on-failure

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DAGENT_PET_REVISION=$($env:GITHUB_SHA.Substring(0, 12))"
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -j $env:NUMBER_OF_PROCESSORS

      - name: Show failed native tests
        if: failure()
        working-directory: starter/build
        run: |
          Get-Content Testing/Temporary/LastTest.log -Tail 80
          # Both suites pass alone; run them together, as ctest -j does, with Qt Test writing to files.
          foreach ($round in 1..4) {
            $runs = foreach ($test in "provider-tests", "event-tests") {
              $log = "$env:RUNNER_TEMP\$test-$round.txt"
              $process = Start-Process ".\$test.exe" -ArgumentList "-o", "$log,txt" -NoNewWindow -PassThru
              $null = $process.Handle
              [pscustomobject]@{ Test = $test; Process = $process; Log = $log }
            }
            foreach ($run in $runs) {
              $run.Process.WaitForExit()
              Write-Host ("round {0}: {1} exit code 0x{2:X8}" -f $round, $run.Test, $run.Process.ExitCode)
              if ($run.Process.ExitCode -ne 0 -and (Test-Path $run.Log)) { Get-Content $run.Log | Out-Host }
            }
          }

      - name: Package
        run: |
          $env:QMAKE = "$env:QT_ROOT_DIR\bin\qmake.exe"
          python scripts/package_windows.py --smoke-test
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            foreach ($asset in "zip", "setup.exe") {
              $suffix = if ($asset -eq "zip") { ".zip" } else { "-setup.exe" }
              if (-not (Test-Path "dist/agent-pet-$version-windows-x86_64$suffix")) { throw "Tag does not match project() version" }
            }
          }
          Get-ChildItem dist

      - name: Check install, upgrade and uninstall
        run: python scripts/check_install_windows.py (Get-Item dist/agent-pet-*-windows-x86_64-setup.exe).FullName

      - uses: actions/upload-artifact@v4
        with:
          name: agent-pet-windows-x86_64
          path: |
            starter/dist/*.zip
            starter/dist/*-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-pet-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            *.tar.gz
            *-components.json
            *.zip
            *.dmg
            *-setup.exe
